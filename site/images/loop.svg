<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="700"
     viewBox="0 0 1000 700">

    <!-- Фон -->
    <rect width="1000" height="700" fill="#f7f7f7"/>

    <!-- Заголовок -->
    <text x="500" y="50"
          text-anchor="middle"
          font-family="Arial"
          font-size="30"
          font-weight="bold">
        Основной игровой цикл
    </text>

    <!-- Блок 1 -->
    <rect x="350" y="80"
          width="300" height="65"
          rx="12"
          fill="white"
          stroke="#333"
          stroke-width="2"/>

    <text x="500" y="121"
          text-anchor="middle"
          font-family="Arial"
          font-size="20">
        Получение ввода
    </text>

    <!-- Блок 2 -->
    <rect x="350" y="185"
          width="300" height="65"
          rx="12"
          fill="white"
          stroke="#333"
          stroke-width="2"/>

    <text x="500" y="226"
          text-anchor="middle"
          font-family="Arial"
          font-size="20">
        Обновление объектов
    </text>

    <!-- Блок 3 -->
    <rect x="350" y="290"
          width="300" height="65"
          rx="12"
          fill="white"
          stroke="#333"
          stroke-width="2"/>

    <text x="500" y="331"
          text-anchor="middle"
          font-family="Arial"
          font-size="20">
        Движение и стрельба
    </text>

    <!-- Блок 4 -->
    <rect x="350" y="395"
          width="300" height="65"
          rx="12"
          fill="white"
          stroke="#333"
          stroke-width="2"/>

    <text x="500" y="436"
          text-anchor="middle"
          font-family="Arial"
          font-size="20">
        Проверка столкновений
    </text>

    <!-- Блок 5 -->
    <rect x="350" y="500"
          width="300" height="65"
          rx="12"
          fill="white"
          stroke="#333"
          stroke-width="2"/>

    <text x="500" y="541"
          text-anchor="middle"
          font-family="Arial"
          font-size="20">
        Изменение состояния
    </text>

    <!-- Блок 6 -->
    <rect x="350" y="605"
          width="300" height="65"
          rx="12"
          fill="#e8e8e8"
          stroke="#333"
          stroke-width="2"/>

    <text x="500" y="646"
          text-anchor="middle"
          font-family="Arial"
          font-size="20">
        Отрисовка кадра
    </text>

    <!-- Стрелки вниз -->
    <g stroke="#333" stroke-width="3">

        <line x1="500" y1="145"
              x2="500" y2="185"/>

        <line x1="500" y1="250"
              x2="500" y2="290"/>

        <line x1="500" y1="355"
              x2="500" y2="395"/>

        <line x1="500" y1="460"
              x2="500" y2="500"/>

        <line x1="500" y1="565"
              x2="500" y2="605"/>

    </g>

    <!-- Циклическая стрелка -->
    <path d="M650 637
             C820 637,
              820 95,
              650 95"
          fill="none"
          stroke="#333"
          stroke-width="3"/>

    <!-- Наконечник стрелки -->
    <polygon points="650,95 670,85 670,105"
             fill="#333"/>

    <!-- Подпись -->
    <text x="840" y="370"
          text-anchor="middle"
          font-family="Arial"
          font-size="18">
        следующий кадр
    </text>

</svg>
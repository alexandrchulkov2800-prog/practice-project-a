<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect width="1100" height="650" fill="#f7f7f7"/>

  <!-- Заголовок -->
  <text x="550" y="55"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#222">
    Система бесконечных волн
  </text>

  <!-- Волна 1 -->
  <rect x="85" y="180" width="220" height="150"
        rx="15"
        fill="#ffffff"
        stroke="#333"
        stroke-width="3"/>

  <text x="195" y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#222">
    ВОЛНА 1
  </text>

  <text x="195" y="260"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    50 пришельцев
  </text>

  <text x="195" y="290"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    Скорость: 100%
  </text>

  <text x="195" y="315"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#666">
    5 рядов × 10
  </text>

  <!-- Стрелка 1 -->
  <line x1="305" y1="255" x2="410" y2="255"
        stroke="#333"
        stroke-width="3"
        marker-end="url(#arrow)"/>

  <text x="355" y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#333">
    все уничтожены
  </text>

  <!-- Волна 2 -->
  <rect x="415" y="180" width="220" height="150"
        rx="15"
        fill="#ffffff"
        stroke="#333"
        stroke-width="3"/>

  <text x="525" y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#222">
    ВОЛНА 2
  </text>

  <text x="525" y="260"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    50 пришельцев
  </text>

  <text x="525" y="290"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    Скорость: ×1.15
  </text>

  <text x="525" y="315"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#666">
    +15% к скорости
  </text>

  <!-- Стрелка 2 -->
  <line x1="635" y1="255" x2="740" y2="255"
        stroke="#333"
        stroke-width="3"
        marker-end="url(#arrow)"/>

  <text x="685" y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="#333">
    все уничтожены
  </text>

  <!-- Волна 3 -->
  <rect x="745" y="180" width="220" height="150"
        rx="15"
        fill="#ffffff"
        stroke="#333"
        stroke-width="3"/>

  <text x="855" y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#222">
    ВОЛНА 3
  </text>

  <text x="855" y="260"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    50 пришельцев
  </text>

  <text x="855" y="290"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    Скорость: ×1.15²
  </text>

  <text x="855" y="315"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#666">
    ещё +15%
  </text>

  <!-- Продолжение -->
  <text x="855" y="390"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#222">
    ...
  </text>

  <text x="855" y="425"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    ВОЛНА 4 → ВОЛНА 5 → ...
  </text>

  <!-- Нижняя схема -->
  <rect x="170" y="490" width="760" height="90"
        rx="15"
        fill="#ffffff"
        stroke="#333"
        stroke-width="3"/>

  <text x="550" y="525"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        fill="#222">
    Все пришельцы уничтожены
  </text>

  <text x="550" y="555"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#444">
    → создаётся новая группа → волна увеличивается → скорость ×1.15
  </text>

  <!-- Циклическая стрелка -->
<path d="M170 535
         C0 535, 0 100, 195 100
         C400 100, 700 100, 855 100"
        fill="none"
        stroke="#333"
        stroke-width="3"
        marker-end="url(#arrow)"/>

  <text x="520" y="90"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#555">
    цикл продолжается бесконечно
  </text>

</svg>
